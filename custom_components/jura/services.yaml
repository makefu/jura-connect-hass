skip_quality_step:
  name: Skip Quality Step
  description: >-
    Skip the current quality-assistant step. Irreversibly skips a
    quality-assistant step; has been seen to zero maintenance counters.
  fields:
    config_entry_id:
      name: Config Entry ID
      selector:
        text:
    entity_id:
      name: Entity
      selector:
        entity:
          integration: jura
    scope:
      name: Scope
      description: >-
        "one" skips the current step, "all" skips the whole quality
        assistant. Defaults to "one".
      selector:
        text:

